description: First Day Entertainment Inc. is a Sunnyvale, California game studio building AI-powered
  games, founded by Stephen Gou (formerly a founding engineer at Cohere) and Mike Mei, and funded by
  the a16z SPEEDRUN accelerator (batch 002) and MiraclePlus. The studio ships two titles - Heroes of
  Magic & Cards, a poker deckbuilding roguelike distributed on Steam, and Mana Land, a single-player
  RPG in which players adventure alongside conversational AI companions, published on itch.io. First
  Day Entertainment is a consumer games company; it publishes no public developer portal, API
  documentation, or machine-readable API artifacts as of this enrichment pass.
